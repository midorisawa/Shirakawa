name: Release

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout commit
        uses: actions/checkout@v6

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@v3
        with:
          version: 11.19.0
          runtime: node@24.19.0
          install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Verify tag and manifest versions
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises';

          const tag = process.env.RELEASE_TAG;
          const match = tag ? /^v(\d+\.\d+\.\d+)$/.exec(tag) : null;
          if (tag && !match) {
            throw new Error(`Release tags must match vX.Y.Z: ${tag}`);
          }

          const manifest = JSON.parse(await readFile('src/manifest.json', 'utf8'));
          if (match && manifest.version !== match[1]) {
            throw new Error(`Tag ${tag} does not match manifest.version ${manifest.version}`);
          }

          console.log(`version=${manifest.version}`);
          await appendFile(process.env.GITHUB_OUTPUT, `version=${manifest.version}\n`);
          NODE

      - name: Build extension
        run: pnpm build

      - name: Create release assets
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          asset="shirakawa-${RELEASE_VERSION}.zip"
          (cd dist && 7z a -tzip "../$asset" *)
          sha256sum "$asset" > "$asset.sha256"

      - name: Upload ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: shirakawa-${{ steps.version.outputs.version }}
          path: |
            shirakawa-${{ steps.version.outputs.version }}.zip
            shirakawa-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: shirakawa-${{ needs.verify.outputs.version }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          asset="shirakawa-${RELEASE_VERSION}.zip"
          gh release create "$RELEASE_TAG" "$asset" "$asset.sha256" \
            --verify-tag \
            --title "Shirakawa $RELEASE_TAG" \
            --generate-notes
